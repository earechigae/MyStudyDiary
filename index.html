<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Diario de Estudio</h1>
    <div class="streaks">
      <span class="current-streak">Racha actual: <strong id="current-streak">0</strong> días</span>
      <span class="best-streak">Mejor racha: <strong id="best-streak">0</strong> días</span>
      <span class="week-minutes weekly-goal-wrapper">Esta semana: <strong id="week-minutes">0</strong> min<span id="weekly-goal-text" class="weekly-goal-text"><span id="weekly-goal-value"></span></span><div id="weekly-progress" class="weekly-progress" hidden><div id="weekly-progress-fill" class="weekly-progress-fill"></div></div><span id="weekly-goal-check" class="weekly-goal-check" hidden>✓</span><div id="weekly-goal-edit" class="weekly-goal-edit" hidden><label for="weekly-goal-input" class="sr-only">Objetivo semanal en minutos</label><input type="number" id="weekly-goal-input" min="1" placeholder="Minutos"><button type="button" id="weekly-goal-save" class="btn-small">Guardar</button><button type="button" id="weekly-goal-clear" class="btn-small">Borrar</button></div></span>
      <span class="days-this-month">Días este mes: <strong id="days-this-month">0</strong></span>
    </div>
  </header>

  <!-- Mapa de calor: grid de 28 celdas (4 semanas × 7 días) -->
  <section id="heat-map-section" class="heat-map-section">
    <div id="heat-map" class="heat-map">
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      <div class="cell sessionless" data-tooltip=""></div>
      </div>
  </section>

  <main>
    <section class="form-section">
      <h2>Registrar sesión</h2>
      <form id="session-form">
        <div class="form-group">
          <label for="fecha">Fecha:</label>
          <input type="date" id="fecha" name="fecha" value="" required>
        </div>
        <div class="form-group">
          <label for="tema">Tema:</label>
          <input type="text" id="tema" name="tema" required>
        </div>
        <div class="form-group">
          <label for="minutos">Minutos:</label>
          <input type="number" id="minutos" name="minutos" min="1" required>
        </div>
        <button type="submit" class="btn">Guardar sesión</button>
      </form>
    </section>

    <section class="sessions-list">
      <h2>Historial de sesiones</h2>
      <!-- Empty state: device de dirección, no decoration/mood.
           Indica qué pasó y qué puede hacer el usuario. -->
      <p class="empty-state" id="empty-state">No hay sesiones registradas aún.<br>Usa el formulario de arriba para tu primera sesión.</p>
      <ul id="sessions-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
